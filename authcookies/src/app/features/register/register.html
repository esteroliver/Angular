<form [formGroup]="form" (ngSubmit)="submit()">
  <label>
    E-mail:
    <input type="email" formControlName="email">
  </label>

  <label>
    Nome:
    <input type="text" formControlName="nome">
  </label>
  <label>
    Senha:
    <input type="password" formControlName="senha">
  </label>
  <label>
    Papel:
    <select name="" id="" formControlName="papel">
      <option [value]="papel.CLIENTE">Cliente</option>
      <option [value]="papel.GESTOR">Gestor</option>
    </select>
  </label>

  <button type="submit">
    Cadastrar-se
  </button>
</form>
